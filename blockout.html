<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Poolroom — Blockout</title>
<style>
  body { margin:0; padding:0; overflow:hidden; background:#000; font-family:monospace; }
  #canvas-container { width:100vw; height:100vh; }
  #hud { position:absolute; top:10px; left:10px; color:#fff; background:rgba(0,0,0,.6);
         padding:8px 12px; border-radius:6px; font-size:13px; z-index:10; }
  #help { position:absolute; bottom:10px; left:10px; color:#ccc; background:rgba(0,0,0,.6);
          padding:8px 12px; border-radius:6px; font-size:12px; z-index:10; line-height:1.6; }
  #crosshair { position:absolute; top:50%; left:50%; width:14px; height:14px;
               transform:translate(-50%,-50%); z-index:5; }
  #crosshair:before, #crosshair:after { content:""; position:absolute; background:rgba(255,255,255,.8); }
  #crosshair:before { width:100%; height:1px; top:50%; }
  #crosshair:after { width:1px; height:100%; left:50%; }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="crosshair"></div>
<div id="hud">click to start</div>
<div id="help">WASD move &middot; shift sprint &middot; space jump &middot; click to capture mouse<br>
metres &middot; poolroom 80&times;80&times;28 &middot; pool 44&times;44&times;7</div>
<script type="module" src="/blockout-main.js"></script>
</body>
</html>
